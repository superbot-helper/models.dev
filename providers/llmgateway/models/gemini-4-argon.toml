schema = 2
base_model = "google/gemini-4-argon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[modalities]
input = ["text", "image", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high"] }
structured_output = true

[limit]
output = 1_048_576

[cost.text.input]
price = 4
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 20
