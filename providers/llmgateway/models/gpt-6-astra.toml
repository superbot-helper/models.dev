schema = 2
base_model = "openai/gpt-6-astra"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
output = 1_050_000

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50
