# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false
effort_updates = false

[limit]
context = 1_050_000
output = 1_050_000

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.6
