# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning; this model has no documented effort tiers
# or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = false
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.2
