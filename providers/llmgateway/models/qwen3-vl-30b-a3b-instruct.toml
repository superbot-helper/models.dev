schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
