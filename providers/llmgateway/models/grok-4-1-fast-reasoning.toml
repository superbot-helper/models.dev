# This model is restricted here to $.reasoning_effort or $.reasoning.effort
# = "low"|"medium"|"high"; no exact token budget is documented for it.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-06-25)
schema = 2
base_model = "xai/grok-4.1-fast-reasoning"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
