schema = 2
base_model = "sakana/fugu-max"
description = "Multi-agent model for routing expert agents across complex analytical tasks"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
