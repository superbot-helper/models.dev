schema = 2
name = "nemotron-3-nano-omni"
description = "The most open, efficient, and accurate omni modal reasoning model for agentic AI."
family = "nemotron"
open_weights = false
release_date = "2026-05-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 300_000
output = 300_000

[cost.text.input]
price = 0.06
cache = { read = 0.06 }

[cost.text.output]
price = 0.24
