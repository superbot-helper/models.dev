schema = 2
base_model = "openai/gpt-5-nano"
base_model_omit = ["limit.input"]
name = "GPT-5 Nano (EU)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 0.055
cache = { read = 0.0055 }

[cost.text.output]
price = 0.44
