# Modalities: image formats from models/thinkingmachines/inkling.toml (same model family; Requesty lists none)
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
name = "inkling-256k"
description = "Inkling 256K is the extended context variant of Inkling, a large MoE hybrid reasoning model from Thinking Machines with audio and vision input support and a 256K context window."
open_weights = false
release_date = "2026-07-16"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = false
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 1.87
cache = { read = 0.374 }

[cost.text.output]
price = 4.68
