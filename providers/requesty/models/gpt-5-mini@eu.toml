schema = 2
base_model = "openai/gpt-5-mini"
base_model_omit = ["limit.input"]
name = "GPT-5 Mini (EU)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 0.275
cache = { read = 0.0275 }

[cost.text.output]
price = 2.2
